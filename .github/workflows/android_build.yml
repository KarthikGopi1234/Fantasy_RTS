name: Android Build - Aether Empires

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  EXPORT_NAME: AetherEmpires

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pillow

      - name: Generate assets
        run: python tools/generate_assets.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          mkdir -p cmdline-tools
          mv latest cmdline-tools/
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          ls -lh $HOME/android-sdk/build-tools/34.0.0/

      - name: Setup Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls -lh ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ | head -n 20

      - name: Restore Keystore from Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from secret for continuity..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > debug.jks
            echo "Keystore restored from secret"
          else
            echo "No secret, using repo's debug.jks"
          fi
          if [ ! -f debug.jks ]; then
            echo "Creating new JKS keystore..."
            keytool -genkey -v -keystore debug.jks -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aether Empires,O=AetherEmpires,C=US"
          fi
          ls -lh debug.jks
          keytool -list -keystore debug.jks -storepass android -v | head -n 20
          # Setup Godot keystores for signing
          mkdir -p ~/.local/share/godot/keystores/
          cp debug.jks ~/.local/share/godot/keystores/debug.keystore
          cp debug.jks ~/.local/share/godot/keystores/release.keystore
          ls -lh ~/.local/share/godot/keystores/
          # Configure Godot editor settings for Android SDK and keystore
          mkdir -p ~/.config/godot/
          cat > ~/.config/godot/editor_settings-4.4.tres << EOF
          [gd_resource type="EditorSettings" load_steps=2 format=3]

          [sub_resource type="InputEventKey" id="InputEventKey_6esip"]
          keycode = 4194326

          [resource]
          export/android/debug_keystore = "/home/runner/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/release_keystore = "/home/runner/.local/share/godot/keystores/release.keystore"
          export/android/release_keystore_user = "androiddebugkey"
          export/android/release_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$HOME/android-sdk"
          EOF
          cat ~/.config/godot/editor_settings-4.4.tres

      - name: Build APK (Non-Gradle Legacy - Reliable)
        run: |
          mkdir -p builds
          echo "=== Godot Export Preset ==="
          cat export_presets.cfg
          echo "=== Project Settings ==="
          grep -E "config/name|config/version|vram_compression" project.godot
          echo "=== Attempting Godot Export (Non-Gradle, produces correct package and icon) ==="
          ./godot --headless --path . --export-release "Android" builds/AetherEmpires.apk --verbose 2>&1 | tee godot_export.log
          echo "=== Export Log Tail ==="
          tail -n 100 godot_export.log
          echo "=== Builds ==="
          ls -lh builds/
          file builds/*.apk || true
          if [ ! -f builds/AetherEmpires.apk ]; then
            echo "Export failed, trying Python fallback"
            python tools/build_release_apk.py
            ls -lh builds/
          fi
          echo "=== Verify Signature ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose builds/AetherEmpires.apk
          echo "=== Check Package Name ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging builds/AetherEmpires.apk | grep -E "package|version|application-label" | head -n 20
          echo "=== Check Icons ==="
          unzip -l builds/AetherEmpires.apk | grep mipmap | head -n 20
          echo "=== Check Size ==="
          du -h builds/AetherEmpires.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: builds/*.apk
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: builds/AetherEmpires.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
