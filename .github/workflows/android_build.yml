name: Android Build - Aether Empires

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  EXPORT_NAME: AetherEmpires

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pillow

      - name: Generate assets
        run: |
          python tools/generate_assets.py
          echo "Assets: $(find assets -type f | wc -l)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK manually
        run: |
          echo "Setting up Android SDK..."
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          mkdir -p cmdline-tools
          mv latest cmdline-tools/
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" || sdkmanager --install "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          sdkmanager --list_installed
          ls -lh $HOME/android-sdk/build-tools/ || true
          adb --version || true

      - name: Setup Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configure Godot
        run: |
          mkdir -p ~/.config/godot/
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/adb = "${ANDROID_HOME}/platform-tools/adb"
          export/android/apksigner = "${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          export/android/debug_keystore = "${{ github.workspace }}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF
          cat ~/.config/godot/editor_settings-4.tres
          # Create keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US" || true
          ls -lh debug.keystore

      - name: Verify
        run: |
          echo "Project: $(grep version project.godot)"
          echo "Assets: $(find assets -type f | wc -l)"

      - name: Export APK
        run: |
          mkdir -p builds
          ./godot --headless --path . --export-debug "Android" builds/${{ env.EXPORT_NAME }}.apk --verbose 2>&1 | tail -200 || true
          if [ ! -f builds/${{ env.EXPORT_NAME }}.apk ]; then
            ./godot --headless --path . --export-release "Android" builds/${{ env.EXPORT_NAME }}.apk --verbose 2>&1 | tail -200 || true
          fi
          ls -lh builds/
          if [ -f builds/${{ env.EXPORT_NAME }}.apk ]; then
            echo "APK OK"
            file builds/${{ env.EXPORT_NAME }}.apk
          else
            echo "APK FAILED"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: builds/*.apk

      - name: Version
        id: version
        run: |
          VERSION=$(grep -oP 'config/version="\K[^"]+' project.godot)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "tag_version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: builds/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
